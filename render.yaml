services:
  - type: web
    name: ghmc-dashboard-web
    runtime: python
    plan: free
    buildCommand: |
      cd ghmc-frontend && npm install && npm run build
      cd ..
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    # Key modification: Move the data loading command here
    preDeployCommand: python manage.py load_excel
    startCommand: gunicorn ghmc_dashboard.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ghmc-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: KOBO_API_KEY
        sync: false
      - key: KOBO_ASSET_UID
        sync: false
      - key: KOBO_SERVER_URL
        sync: false

databases:
  - name: ghmc-db
    plan: free
    databaseName: ghmc_dashboard
    user: ghmc_user